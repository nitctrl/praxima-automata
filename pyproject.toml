[project]
name = "livekit-2"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.70,<1",
    "livekit>=1.1.13",
    "livekit-agents[sarvam,silero]~=1.5",
    "livekit-plugins-anthropic>=1.3.11",
    "livekit-plugins-noise-cancellation>=0.2.6",
    "livekit-plugins-turn-detector==1.3.11",
    "python-dotenv>=1.2.2",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2.13,<3",
    "typing-extensions>=4.12,<5",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "jinja2>=3.1,<4",
    "httpx>=0.28,<1",
    "cryptography>=44",
    "aiohttp>=3.10,<4",
    "python-docx>=1.1,<2",
    "livekit-plugins-google>=1.8.2",
    "google-genai>=2.25.0",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "alembic>=1.14,<2",
    "pyyaml>=6.0,<7",
    "jsonschema>=4.23,<5",
    "python-dateutil>=2.9,<3",
]

[project.optional-dependencies]
# Optional local semantic retrieval for document lookups; lexical search still works without it.
semantic = ["fastembed>=0.4,<1"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff",
    "mypy",
    "build",
    "hatchling",
    "types-pyyaml>=6.0.12.20260906",
    "types-jsonschema>=4.26.0.20260518",
    "types-python-dateutil>=2.9.0.20260807",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/praxima"]

[tool.hatch.build.targets.sdist]
include = ["src/praxima", "src/agent.py", "db", "alembic.ini", "tests", "scripts", "supabase", "docs", "pyproject.toml", "uv.lock", "README.md", ".env.example"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--tb=short"
markers = ["integration: explicit opt-in tests against the dedicated development database"]

[tool.ruff]
target-version = "py310"
line-length = 100
# Keep formatting changes out of the existing voice POC.
include = ["src/praxima/**/*.py", "tests/**/*.py", "scripts/**/*.py", "db/**/*.py"]
# The restored voice POC worker keeps its original formatting (was src/agent.py).
extend-exclude = ["src/praxima/entrypoints/voice_worker.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
files = ["main.py", "src/praxima", "scripts", "db/migrations"]
# Untyped voice POC worker, unchecked as before the move (was src/agent.py).
exclude = ["src/praxima/entrypoints/voice_worker\\.py$"]
mypy_path = "src"
explicit_package_bases = true
strict = true

[[tool.mypy.overrides]]
module = ["docx.*", "fastembed.*"]
ignore_missing_imports = true
