[project]
name = "livekit-2"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.70,<1",
    "livekit>=1.1.13",
    "livekit-agents[sarvam,silero]~=1.5",
    "livekit-plugins-anthropic>=1.3.11",
    "livekit-plugins-noise-cancellation>=0.2.6",
    "livekit-plugins-turn-detector==1.3.11",
    "python-dotenv>=1.2.2",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2.13,<3",
    "typing-extensions>=4.12,<5",
    "jinja2>=3.1,<4",
    "httpx>=0.28,<1",
    "cryptography>=44",
    "python-docx>=1.1,<2",
    "redis>=5,<7",
]

[project.optional-dependencies]
# Optional local semantic retrieval for document lookups; lexical search still works without it.
semantic = ["fastembed>=0.4,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff", "mypy", "build", "hatchling"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinic"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "sip", "docs", "pyproject.toml", "uv.lock", "README.md", ".env.example"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
files = ["src/clinic"]
mypy_path = "src"
explicit_package_bases = true
strict = true

[[tool.mypy.overrides]]
module = ["docx.*", "fastembed.*"]
ignore_missing_imports = true
