# Alembic manages the NEW vendor-neutral database (docs/architecture/0001-sqlalchemy-and-alembic.md).
# The database URL comes only from DB_OWNER_DATABASE_URL (environment or .env), never this file.

[alembic]
script_location = %(here)s/db/migrations
prepend_sys_path = src
path_separator = os
# Revisions are numbered: 0001_foundation.py, 0002_iam_tenancy.py, ...
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
