# Real-estate domain pack: a developer's projects, units, site offices and sales team.
# Data only: installing it into a workspace copies these definitions. Bump `version` for any
# change; workspaces upgrade explicitly.
key: real_estate
version: 1.0.0
name: Real estate
industry: real_estate
languages: [hi-IN, en-IN]

# Files in entity_types/ (one JSON Schema per type).
entity_types: [project, property, site_office, sales_agent]

relation_types:
  - key: property_in_project
    from: property
    to: project
    description: This unit or listing belongs to the project.
    attributes_schema: {type: object, additionalProperties: false, properties: {}}
  - key: sales_agent_for_project
    from: sales_agent
    to: project
    description: This sales agent handles enquiries and site visits for the project.
    attributes_schema: {type: object, additionalProperties: false, properties: {}}
  - key: project_site_office
    from: project
    to: site_office
    description: Visitors meet the sales team for this project at this office.
    attributes_schema: {type: object, additionalProperties: false, properties: {}}

# Entity types that can have weekly hours (site-visit windows) and dated exceptions.
availability_for: [site_office, sales_agent]

# Kinds of reviewed documents staff can upload.
document_categories:
  [about, project_brochure, price_sheet, rera, amenities, payment_plan, home_loans, policies, other]

# Kinds of live updates (announcements) staff can post.
announcement_kinds:
  [information, closure, launch, offer, inventory_update, site_visits_paused]

# Requests staff follow up (files in work_items/). Never a booking, price or allotment.
work_item_kinds: [site_visit_request, lead_inquiry, callback_request]
# What the generic request_callback tool creates.
callback_kind: callback_request

# Starter wording for new agents (staff edit it before publishing).
agent_defaults:
  greeting_message: "Namaste! Thanks for calling. Which project can I help you with today?"
  emergency_message: "If this is an emergency, please hang up and call 112 now."
  fallback_message: "I'm not able to help with that. Our sales team will call you back."

# Generic voice tools this pack enables by default (keys from the runtime tool registry).
tools:
  - find_entities
  - get_entity
  - get_availability
  - search_knowledge
  - get_announcements
  - create_work_item
  - request_callback
